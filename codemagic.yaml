workflows:
  android-release:
    name: Study2Gate Android (signed APK)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Variable group created in Codemagic. It should hold every
      # REACT_APP_* value required by your application. Firebase's
      # google-services.json is committed at android/app/google-services.json.
      groups:
        - firebase
      # Capacitor 8 needs a recent Node and JDK. If Capacitor's docs list
      # different minimums for your exact version, change these two lines.
      node: 22
      java: 21
      vars:
        # Create React App turns lint warnings into build errors when CI=true.
        CI: "false"

      # Name of the keystore you upload in Codemagic under
      # Teams > Code signing identities > Android keystores. Codemagic then
      # provides CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS and
      # CM_KEY_PASSWORD to the scripts below.
      android_signing:
        - Godsent

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Validate Firebase configuration
        script: |
          set -euo pipefail
          FIREBASE_CONFIG="android/app/google-services.json"

          if [ ! -f "$FIREBASE_CONFIG" ]; then
            echo "Firebase configuration missing: $FIREBASE_CONFIG" >&2
            echo "Commit google-services.json to the GitHub repository at android/app/google-services.json." >&2
            exit 1
          fi

          python3 -m json.tool "$FIREBASE_CONFIG" > /dev/null
          echo "Firebase configuration exists and contains valid JSON."

      - name: Build web app and sync to Android
        script: |
          npm run build
          npx cap sync android

      - name: Build release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign APK
        script: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"

          # Gradle leaves the APK unsigned unless build.gradle has its own
          # signingConfig, so find whichever one it produced.
          APK_IN="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          if [ -z "$APK_IN" ]; then
            echo "No release APK found." >&2
            exit 1
          fi

          mkdir -p build-output
          "${BUILD_TOOLS}zipalign" -p -f 4 "$APK_IN" build-output/study2gate-aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$CM_KEYSTORE_PATH" \
            --ks-pass "pass:$CM_KEYSTORE_PASSWORD" \
            --ks-key-alias "$CM_KEY_ALIAS" \
            --key-pass "pass:$CM_KEY_PASSWORD" \
            --out build-output/study2gate.apk \
            build-output/study2gate-aligned.apk
          "${BUILD_TOOLS}apksigner" verify --print-certs build-output/study2gate.apk

    artifacts:
      - build-output/study2gate.apk

    publishing:
      email:
        recipients:
          - godsentomobude@gmail.com
        notify:
          success: true
          failure: true
